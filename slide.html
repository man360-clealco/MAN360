// Slide 960x540
const SW = 960, SH = 540;

async function db(table, q) {
  const r = await fetch(SB_URL+'/rest/v1/'+table+'?'+q,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
  if(!r.ok) throw new Error('DB '+r.status);
  return r.json();
}

function gp(){
  const p=new URLSearchParams(location.search);
  return {
    equipe: p.get('equipe')||'',
    tipos:  (p.get('tipos')||'').split('|').filter(Boolean),
    inicio: p.get('inicio')||'',
    nEqProp: parseInt(p.get('nEqProp'))||1,
  };
}

function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

// Calcular curva ideal: HH acumulado por dia útil a partir da data de início
function curvaIdeal(dtInicio, totalHH, hhDiario) {
  const pts=[];
  let acum=0, d=new Date(dtInicio+'T12:00:00');
  pts.push({d:new Date(d),hh:0});
  let guard=0;
  while(acum<totalHH&&guard<500){
    guard++;
    if(d.getDay()!==0) acum=Math.min(acum+hhDiario,totalHH);
    d=new Date(d); d.setDate(d.getDate()+1);
    pts.push({d:new Date(d),hh:acum});
  }
  return pts;
}

// HH diário estimado (equipes próprias × 8.33h × pessoas por equipe)
const HH_DIA_COLAB=8.33, PESSOAS_EQ=2;
function hhDiario(nEq){ return nEq*PESSOAS_EQ*HH_DIA_COLAB; }

// Diferença em dias entre duas datas
function diffDias(d1,d2){ return Math.round((d2-d1)/86400000); }

// Calcular data de conclusão projetada somando dias úteis
function dataConclusao(dtIni, hhRest, hhDia){
  if(hhRest<=0) return new Date(dtIni);
  let d=new Date(dtIni+'T12:00:00'), cont=0;
  const max=hhRest/Math.max(hhDia,1);
  while(cont<max&&cont<500){
    d=new Date(d); d.setDate(d.getDate()+1);
    if(d.getDay()!==0) cont++;
  }
  return d;
}

async function main(){
  const p=gp();
  try{
    // Buscar OS
    let q='select=os,desc_servico,hh_prev_os,proj_criticidade,status_os,proj_tipo_intervencao';
    q+='&equipe=eq.'+encodeURIComponent(p.equipe)+'&tipo_atividade=neq.MCU';
    if(p.tipos.length) q+='&proj_tipo_intervencao=in.('+p.tipos.map(t=>'"'+t.trim()+'"').join(',')+')';
    const os=await db('ordens_servico',q);

    const totalHH=os.reduce((s,o)=>s+(o.hh_prev_os||0),0);
    const hhExec=os.filter(o=>(o.status_os||'').toLowerCase().includes('encerr')).reduce((s,o)=>s+(o.hh_prev_os||0),0);
    const osExec=os.filter(o=>(o.status_os||'').toLowerCase().includes('encerr')).length;
    const osTotal=os.length;

    const hhDia=hhDiario(p.nEqProp);
    const hoje=new Date(); hoje.setHours(12,0,0,0);
    const hojeIso=isoDate(hoje);

    // Curva ideal
    const ideal=curvaIdeal(p.inicio,totalHH,hhDia);
    // Data fim ideal
    const dtFimIdeal=ideal[ideal.length-1].d;

    // Curva real: pegar HH encerrado por dia a partir das OS (simplificado — acumula tudo até hoje)
    // Como não temos data de encerramento por OS aqui, usamos HH total executado até hoje como ponto único
    const dtInicioDt=new Date(p.inicio+'T12:00:00');
    const real=[
      {d:dtInicioDt,hh:0},
      {d:new Date(hoje),hh:hhExec},
    ];

    // Projeção futura a partir de hoje
    const hhRestante=Math.max(0,totalHH-hhExec);
    const dtConclusaoProj=dataConclusao(hojeIso,hhRestante,hhDia);
    const proj=[{d:new Date(hoje),hh:hhExec}];
    let acum2=hhExec, d2=new Date(hoje);
    let guard=0;
    while(acum2<totalHH&&guard<500){
      guard++; d2=new Date(d2); d2.setDate(d2.getDate()+1);
      if(d2.getDay()!==0) acum2=Math.min(acum2+hhDia,totalHH);
      proj.push({d:new Date(d2),hh:acum2});
    }

    // Delta: onde a curva ideal estaria hoje vs hhExec real
    let hhIdealHoje=0;
    for(const pt of ideal){
      if(pt.d<=hoje) hhIdealHoje=pt.hh;
      else break;
    }
    const hhDelta=hhExec-hhIdealHoje;
    const diasDelta=hhDia>0?Math.round(hhDelta/hhDia):0;
    const adiantado=diasDelta>=0;

    // Data prevista conclusão formatada
    const dtFmt=dtConclusaoProj.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
    const hoje2=new Date(); hoje2.setHours(0,0,0,0);
    const diasParaConclusao=diffDias(hoje2,dtConclusaoProj);

    // Desenhar slide
    const canvas=document.getElementById('slide');
    canvas.width=SW; canvas.height=SH;
    document.getElementById('wrap').style.width=SW+'px';

    const logo=new Image();
    logo.onload=()=>{
      desenhar(canvas,logo,{
        p,totalHH,hhExec,osExec,osTotal,
        ideal,real,proj,
        diasDelta,adiantado,dtFmt,diasParaConclusao,
        dtInicioDt,dtConclusaoProj,hoje,
        tiposStr:p.tipos.join(', ')||'Todos',
      });
      document.getElementById('loading').style.display='none';
      document.getElementById('wrap').style.display='block';
      document.getElementById('btn-dl').style.display='block';
      document.getElementById('bar-titulo').textContent=p.equipe+' · '+(p.tipos.join(', ')||'Todos');
    };
    logo.src=LOGO_SRC;

  }catch(e){
    console.error(e);
    document.getElementById('loading').innerHTML='Erro: '+e.message;
  }
}

function fmtHH(v){return v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)+'h';}

function desenhar(canvas,logo,D){
  const ctx=canvas.getContext('2d');
  const W=SW, H=SH;

  // Fundo branco
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,W,H);

  // ── Cabeçalho ──
  const HDR=68;
  // Bloco logo: fundo amarelo Clealco
  ctx.fillStyle='#F8C100';
  ctx.fillRect(0,0,168,HDR);
  // Logo sem esticamento: manter proporção
  const lW=140, lH=52;
  ctx.drawImage(logo, 14, (HDR-lH)/2, lW, lH);

  // Faixa cinza clara header
  ctx.fillStyle='#f0f0f0';
  ctx.fillRect(168,0,W-168,HDR-4);
  // Linha vermelha
  ctx.fillStyle='#c0392b';
  ctx.fillRect(168,HDR-5,W-168,4);

  // Título principal
  ctx.fillStyle='#111111';
  ctx.font='bold 14px Arial';
  ctx.textAlign='left';
  const tipoLabel = D.p.tipos.length ? D.p.tipos.join(', ').toUpperCase() : 'TODOS';
  ctx.fillText('PROJETOS DE SEGURANÇA — '+tipoLabel, 184, HDR/2+5);

  // Subtítulo direita
  ctx.fillStyle='#555555';
  ctx.font='9px Arial';
  ctx.textAlign='right';
  const hoje2=new Date();
  ctx.fillText('Gerado em '+hoje2.toLocaleDateString('pt-BR')+' · Equipe '+D.p.equipe, W-16, 26);
  ctx.fillText('Início: '+D.p.inicio, W-16, 40);

  // ── Cards ──
  const CX=12, CY=HDR+10, CW=168, CH=62, GAP=8;

  function roundRect(x,y,w,h,r,fill,stroke){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
    ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
    ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
    ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
    ctx.closePath();
    if(fill){ctx.fillStyle=fill;ctx.fill();}
    if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.2;ctx.stroke();}
  }

  // Card 1: HH Executado
  roundRect(CX,CY,CW,CH,'#1a1a1a',null);
  ctx.fillStyle='rgba(255,255,255,0.55)';
  ctx.font='bold 8px Arial'; ctx.textAlign='left';
  ctx.fillText('HH EXECUTADO', CX+10, CY+14);
  ctx.fillStyle='#F8C100';
  ctx.font='bold 22px Arial';
  ctx.fillText(Math.round(D.hhExec)+'/'+Math.round(D.totalHH)+' HH', CX+10, CY+42);

  // Card 2: OS Executadas
  roundRect(CX, CY+CH+GAP, CW, CH, '#f9fafb', '#d1d5db');
  ctx.fillStyle='#333333';
  ctx.font='bold 8px Arial'; ctx.textAlign='left';
  ctx.fillText('OS EXECUTADAS', CX+10, CY+CH+GAP+14);
  ctx.fillStyle='#111111';
  ctx.font='bold 22px Arial';
  ctx.fillText(D.osExec+'/'+D.osTotal+' OS', CX+10, CY+CH+GAP+42);

  // Card 3: Situação
  const c3bg=D.adiantado?'#f0fdf4':'#fff1f2';
  const c3bd=D.adiantado?'#4ade80':'#f87171';
  const c3cor=D.adiantado?'#15803d':'#b91c1c';
  roundRect(CX, CY+(CH+GAP)*2, CW, CH, c3bg, c3bd);
  ctx.fillStyle=c3cor;
  ctx.font='bold 8px Arial'; ctx.textAlign='left';
  ctx.fillText('EM RELAÇÃO AO PLANO', CX+10, CY+(CH+GAP)*2+14);
  // Label situação
  let sitLabel;
  if(D.diasDelta===0) sitLabel='Em dia';
  else if(D.adiantado) sitLabel='Adiantado +'+D.diasDelta+'D';
  else sitLabel='Atraso '+D.diasDelta+'D';
  ctx.fillStyle=c3cor;
  ctx.font='bold 20px Arial';
  ctx.fillText(sitLabel, CX+10, CY+(CH+GAP)*2+42);

  // Card 4: Previsão de conclusão
  roundRect(CX, CY+(CH+GAP)*3, CW, CH, '#f9fafb', '#d1d5db');
  ctx.fillStyle='#333333';
  ctx.font='bold 8px Arial'; ctx.textAlign='left';
  ctx.fillText('PREVISÃO DE CONCLUSÃO', CX+10, CY+(CH+GAP)*3+14);
  ctx.fillStyle='#111111';
  ctx.font='bold 18px Arial';
  ctx.fillText(D.dtFmt, CX+10, CY+(CH+GAP)*3+38);
  ctx.fillStyle='#444444';
  ctx.font='bold 10px Arial';
  ctx.fillText('em '+D.diasParaConclusao+' dias', CX+10, CY+(CH+GAP)*3+CH-10);

  // ── Gráfico ──
  const GX=CX+CW+12, GY=HDR+10;
  const GW=W-GX-12, GH=H-HDR-20;
  const PAD={t:36,r:16,b:34,l:52};
  const cW=GW-PAD.l-PAD.r, cH=GH-PAD.t-PAD.b;
  const ax=GX+PAD.l, ay=GY+PAD.t;

  // Fundo gráfico
  roundRect(GX,GY,GW,GH,'#ffffff','#d1d5db');

  // Extremos de tempo
  const tMin=D.dtInicioDt.getTime();
  const tMax=D.dtConclusaoProj.getTime();
  function px(d){return ax+Math.max(0,Math.min(1,(d.getTime()-tMin)/(tMax-tMin)))*cW;}
  function py(hh){return ay+cH-(hh/D.totalHH)*cH;}

  // Linhas de grade horizontais
  const nGrid=5;
  for(let i=0;i<=nGrid;i++){
    const y=ay+(i/nGrid)*cH;
    const hh=D.totalHH-(i/nGrid)*D.totalHH;
    ctx.strokeStyle='#e5e7eb'; ctx.lineWidth=0.8; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(ax,y); ctx.lineTo(ax+cW,y); ctx.stroke();
    ctx.fillStyle='#444444'; ctx.font='bold 8px Arial'; ctx.textAlign='right';
    ctx.fillText(Math.round(hh)+'h', ax-5, y+3);
  }

  // Marcadores de semana (seg–dom) — linhas discretas verticais
  const mseg=new Date(D.dtInicioDt);
  // Avançar para próxima segunda
  while(mseg.getDay()!==1) mseg.setDate(mseg.getDate()+1);
  ctx.strokeStyle='#eeeeee'; ctx.lineWidth=1; ctx.setLineDash([2,3]);
  while(mseg.getTime()<=tMax){
    const x=px(mseg);
    ctx.beginPath(); ctx.moveTo(x,ay); ctx.lineTo(x,ay+cH); ctx.stroke();
    mseg.setDate(mseg.getDate()+7);
  }
  ctx.setLineDash([]);

  // Labels eixo X (meses)
  ctx.fillStyle='#444444'; ctx.font='bold 8px Arial'; ctx.textAlign='center';
  const meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  let dm=new Date(D.dtInicioDt.getFullYear(),D.dtInicioDt.getMonth(),1);
  const dFim=new Date(tMax);
  while(dm<=dFim){
    const x=px(dm);
    if(x>=ax&&x<=ax+cW){
      ctx.fillStyle='#444444';
      ctx.fillText(meses[dm.getMonth()]+'/'+String(dm.getFullYear()).slice(2), x, ay+cH+14);
      ctx.strokeStyle='#dddddd'; ctx.lineWidth=0.8; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(x,ay); ctx.lineTo(x,ay+cH); ctx.stroke();
    }
    dm=new Date(dm.getFullYear(),dm.getMonth()+1,1);
  }

  // ── Curva ideal (azul sólida) — SEM área preenchida ──
  ctx.beginPath(); ctx.strokeStyle='#2563eb'; ctx.lineWidth=2.5; ctx.setLineDash([]);
  D.ideal.forEach((pt,i)=> i===0?ctx.moveTo(px(pt.d),py(pt.hh)):ctx.lineTo(px(pt.d),py(pt.hh)));
  ctx.stroke();

  // ── Projeção (verde tracejado claro) + área ──
  ctx.beginPath();
  ctx.moveTo(px(D.proj[0].d),py(0));
  D.proj.forEach(pt=>ctx.lineTo(px(pt.d),py(pt.hh)));
  ctx.lineTo(px(D.proj[D.proj.length-1].d),py(0));
  ctx.closePath(); ctx.fillStyle='rgba(134,239,172,0.10)'; ctx.fill();

  ctx.beginPath(); ctx.strokeStyle='#4ade80'; ctx.lineWidth=2.5; ctx.setLineDash([7,4]);
  D.proj.forEach((pt,i)=> i===0?ctx.moveTo(px(pt.d),py(pt.hh)):ctx.lineTo(px(pt.d),py(pt.hh)));
  ctx.stroke(); ctx.setLineDash([]);

  // ── Curva real (verde sólida) + área ──
  ctx.beginPath();
  ctx.moveTo(px(D.real[0].d),py(0));
  D.real.forEach(pt=>ctx.lineTo(px(pt.d),py(pt.hh)));
  ctx.lineTo(px(D.real[D.real.length-1].d),py(0));
  ctx.closePath(); ctx.fillStyle='rgba(22,163,74,0.08)'; ctx.fill();

  ctx.beginPath(); ctx.strokeStyle='#16a34a'; ctx.lineWidth=3; ctx.setLineDash([]);
  D.real.forEach((pt,i)=> i===0?ctx.moveTo(px(pt.d),py(pt.hh)):ctx.lineTo(px(pt.d),py(pt.hh)));
  ctx.stroke();

  // Ponto início (marcação na curva)
  ctx.beginPath(); ctx.arc(px(D.dtInicioDt),py(0),5,0,Math.PI*2);
  ctx.fillStyle='#16a34a'; ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle='#333333'; ctx.font='bold 8px Arial'; ctx.textAlign='center';
  ctx.fillText('Início', px(D.dtInicioDt), py(0)+16);

  // Ponto final real
  const lr=D.real[D.real.length-1];
  ctx.beginPath(); ctx.arc(px(lr.d),py(lr.hh),5,0,Math.PI*2);
  ctx.fillStyle='#16a34a'; ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();

  // ── Linha "Hoje" ──
  const xHoje=px(D.hoje);
  ctx.beginPath(); ctx.strokeStyle='#374151'; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
  ctx.moveTo(xHoje,ay); ctx.lineTo(xHoje,ay+cH); ctx.stroke(); ctx.setLineDash([]);
  // Label HOJE
  ctx.fillStyle='#1a1a1a';
  const lbW=36, lbH=15;
  ctx.beginPath();
  ctx.roundRect(xHoje-lbW/2, ay-lbH-2, lbW, lbH, 3);
  ctx.fill();
  ctx.fillStyle='#ffffff'; ctx.font='bold 8px Arial'; ctx.textAlign='center';
  ctx.fillText('HOJE', xHoje, ay-lbH/2+1);

  // ── Seta de delta — só se |diasDelta| >= 1 ──
  if(Math.abs(D.diasDelta)>=1){
    let xIdealHoje=xHoje;
    for(let i=1;i<D.ideal.length;i++){
      if(D.ideal[i].hh>=D.hhExec){xIdealHoje=px(D.ideal[i].d);break;}
    }
    if(Math.abs(xHoje-xIdealHoje)>6){
      const yDelta=py(D.hhExec)-14;
      const cor=D.adiantado?'#15803d':'#b91c1c';
      ctx.strokeStyle=cor; ctx.lineWidth=2; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(xIdealHoje,yDelta); ctx.lineTo(xHoje,yDelta); ctx.stroke();
      const dir=D.adiantado?1:-1;
      ctx.fillStyle=cor;
      ctx.beginPath();
      ctx.moveTo(xHoje+dir*6,yDelta);
      ctx.lineTo(xHoje,yDelta-4);
      ctx.lineTo(xHoje,yDelta+4);
      ctx.closePath(); ctx.fill();
    }
  }

  // ── Legenda ──
  const LX=ax, LY=GY+16;
  ctx.font='bold 8px Arial'; ctx.textAlign='left';
  // Ideal
  ctx.strokeStyle='#2563eb'; ctx.lineWidth=2.5; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(LX,LY); ctx.lineTo(LX+22,LY); ctx.stroke();
  ctx.fillStyle='#222222'; ctx.fillText('Plano ideal',LX+26,LY+3);
  // Real
  ctx.strokeStyle='#16a34a'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(LX+110,LY); ctx.lineTo(LX+132,LY); ctx.stroke();
  ctx.fillStyle='#222222'; ctx.fillText('Realizado',LX+136,LY+3);
  // Projeção
  ctx.strokeStyle='#4ade80'; ctx.lineWidth=2.5; ctx.setLineDash([6,3]);
  ctx.beginPath(); ctx.moveTo(LX+220,LY); ctx.lineTo(LX+242,LY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#222222'; ctx.fillText('Projeção',LX+246,LY+3);
}

window.baixarImagem=function(){
  const canvas=document.getElementById('slide');
  canvas.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='slide-projetos-seguranca.png';
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  },'image/png');
};

main();
</script>
</body>
</html>
