// Slide 960x540
const SW = 960, SH = 540;

async function db(table, q) {
  const r = await fetch(SB_URL+'/rest/v1/'+table+'?'+q,{headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}});
  if(!r.ok) throw new Error('DB '+r.status);
  return r.json();
}

function gp(){
  const p=new URLSearchParams(location.search);
  return {
    equipe: p.get('equipe')||'',
    tipos:  (p.get('tipos')||'').split('|').filter(Boolean),
    inicio: p.get('inicio')||'',
    nEqProp: parseInt(p.get('nEqProp'))||1,
  };
}

function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

// Calcular curva ideal: HH acumulado por dia útil a partir da data de início
function curvaIdeal(dtInicio, totalHH, hhDiario) {
  const pts=[];
  let acum=0, d=new Date(dtInicio+'T12:00:00');
  pts.push({d:new Date(d),hh:0});
  let guard=0;
  while(acum<totalHH&&guard<500){
    guard++;
    if(d.getDay()!==0) acum=Math.min(acum+hhDiario,totalHH);
    d=new Date(d); d.setDate(d.getDate()+1);
    pts.push({d:new Date(d),hh:acum});
  }
  return pts;
}

// HH diário estimado (equipes próprias × 8.33h × pessoas por equipe)
const HH_DIA_COLAB=8.33, PESSOAS_EQ=2;
function hhDiario(nEq){ return nEq*PESSOAS_EQ*HH_DIA_COLAB; }

// Diferença em dias entre duas datas
function diffDias(d1,d2){ return Math.round((d2-d1)/86400000); }

// Calcular data de conclusão projetada somando dias úteis
function dataConclusao(dtIni, hhRest, hhDia){
  if(hhRest<=0) return new Date(dtIni);
  let d=new Date(dtIni+'T12:00:00'), cont=0;
  const max=hhRest/Math.max(hhDia,1);
  while(cont<max&&cont<500){
    d=new Date(d); d.setDate(d.getDate()+1);
    if(d.getDay()!==0) cont++;
  }
  return d;
}

async function main(){
  const p=gp();
  try{
    // Buscar OS
    let q='select=os,cod_servico,desc_servico,hh_prev_os,proj_criticidade,status_os,proj_tipo_intervencao';
    q+='&equipe=eq.'+encodeURIComponent(p.equipe)+'&tipo_atividade=neq.MCU';
    if(p.tipos.length) q+='&proj_tipo_intervencao=in.('+p.tipos.map(t=>'"'+t.trim()+'"').join(',')+')';
    const os=await db('ordens_servico',q);

    // Excluir OS canceladas/suspensas de todos os cálculos
    function isCancelada(o){ const s=(o.status_os||'').toLowerCase(); return s.includes('cancel')||s.includes('suspend'); }
    const osValidas = os.filter(o=>!isCancelada(o));
    const pontos  = osValidas.filter(o => !o.cod_servico || String(o.cod_servico) === '1');
    const ptTotal = pontos.length;
    const ptEnc   = pontos.filter(o=>(o.status_os||'').toLowerCase().includes('encerr')).length;

    const totalHH=osValidas.reduce((s,o)=>s+(o.hh_prev_os||0),0);
    const hhExec=osValidas.filter(o=>(o.status_os||'').toLowerCase().includes('encerr')).reduce((s,o)=>s+(o.hh_prev_os||0),0);
    const osExec=osValidas.filter(o=>(o.status_os||'').toLowerCase().includes('encerr')).length;
    const osTotal=osValidas.length;

    const hhDia=hhDiario(p.nEqProp);
    const hoje=new Date(); hoje.setHours(12,0,0,0);
    const hojeIso=isoDate(hoje);

    // Curva ideal
    const ideal=curvaIdeal(p.inicio,totalHH,hhDia);
    // Data fim ideal
    const dtFimIdeal=ideal[ideal.length-1].d;

    // Curva real: pegar HH encerrado por dia a partir das OS (simplificado — acumula tudo até hoje)
    // Como não temos data de encerramento por OS aqui, usamos HH total executado até hoje como ponto único
    const dtInicioDt=new Date(p.inicio+'T12:00:00');
    const real=[
      {d:dtInicioDt,hh:0},
      {d:new Date(hoje),hh:hhExec},
    ];

    // Projeção futura a partir de hoje
    const hhRestante=Math.max(0,totalHH-hhExec);
    const dtConclusaoProj=dataConclusao(hojeIso,hhRestante,hhDia);
    const proj=[{d:new Date(hoje),hh:hhExec}];
    let acum2=hhExec, d2=new Date(hoje);
    let guard=0;
    while(acum2<totalHH&&guard<500){
      guard++; d2=new Date(d2); d2.setDate(d2.getDate()+1);
      if(d2.getDay()!==0) acum2=Math.min(acum2+hhDia,totalHH);
      proj.push({d:new Date(d2),hh:acum2});
    }

    // Delta: onde a curva ideal estaria hoje vs hhExec real
    let hhIdealHoje=0;
    for(const pt of ideal){
      if(pt.d<=hoje) hhIdealHoje=pt.hh;
      else break;
    }
    const hhDelta=hhExec-hhIdealHoje;
    const diasDelta=hhDia>0?Math.round(hhDelta/hhDia):0;
    const adiantado=diasDelta>=0;

    // Data prevista conclusão formatada
    const dtFmt=dtConclusaoProj.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
    const hoje2=new Date(); hoje2.setHours(0,0,0,0);
    const diasParaConclusao=diffDias(hoje2,dtConclusaoProj);

    // Desenhar slide
    const canvas=document.getElementById('slide');
    canvas.width=SW; canvas.height=SH;
    document.getElementById('wrap').style.width=SW+'px';

    const logo=new Image();
    logo.onload=()=>{
      desenhar(canvas,logo,{
        p,totalHH,hhExec,osExec,osTotal,ptTotal,ptEnc,
        ideal,real,proj,
        diasDelta,adiantado,dtFmt,diasParaConclusao,
        dtInicioDt,dtConclusaoProj,hoje,
        tiposStr:p.tipos.join(', ')||'Todos',
      });
      document.getElementById('loading').style.display='none';
      document.getElementById('wrap').style.display='block';
      document.getElementById('btn-dl').style.display='block';
      document.getElementById('bar-titulo').textContent=p.equipe+' · '+(p.tipos.join(', ')||'Todos');
    };
    logo.src=LOGO_SRC;

  }catch(e){
    console.error(e);
    document.getElementById('loading').innerHTML='Erro: '+e.message;
  }
}

function fmtHH(v){return v>=1000?(v/1000).toFixed(1)+'k':Math.round(v)+'h';}

function desenhar(canvas,logo,D){
  const ctx=canvas.getContext('2d');
  const W=SW, H=SH;

  // Fundo branco
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,W,H);

  // ── Cabeçalho ──
  const HDR=70;
  // Bloco logo amarelo
  ctx.fillStyle='#F8C100';
  ctx.fillRect(0,0,170,HDR);
  // Logo proporcional centralizado
  const lRatio=logo.width/logo.height;
  const lH=52, lW=lH*lRatio;
  ctx.drawImage(logo,(170-lW)/2,(HDR-lH)/2,lW,lH);

  // Fundo cinza claro header
  ctx.fillStyle='#f2f2f2';
  ctx.fillRect(170,0,W-170,HDR-5);
  // Linha vermelha inferior
  ctx.fillStyle='#c0392b';
  ctx.fillRect(170,HDR-5,W-170,5);

  // Título principal — estilo do exemplo
  ctx.fillStyle='#111111';
  ctx.font='bold 20px Arial';
  ctx.textAlign='left';
  const tipoLabel=D.p.tipos.length?D.p.tipos.join(', ').toUpperCase():'TODOS';
  ctx.fillText('PROJETOS DE SEGURANÇA — '+tipoLabel,190,HDR/2+7);

  // Info direita
  ctx.fillStyle='#666666';
  ctx.font='9px Arial';
  ctx.textAlign='right';
  ctx.fillText('Gerado em '+new Date().toLocaleDateString('pt-BR')+' · Equipe '+D.p.equipe,W-16,24);

  // ── Área do gráfico ──
  const CW_CARDS=175;
  const GX=CW_CARDS+10, GY=HDR+10;
  const GW=W-GX-12, GH=H-HDR-20;
  const PAD={t:38,r:16,b:36,l:54};
  const cW=GW-PAD.l-PAD.r, cH=GH-PAD.t-PAD.b;
  const ax=GX+PAD.l, ay=GY+PAD.t;

  // Fundo gráfico
  ctx.fillStyle='#ffffff';
  ctx.strokeStyle='#cccccc';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.roundRect(GX,GY,GW,GH,4);
  ctx.fill(); ctx.stroke();

  // Extremos de tempo
  const tMin=D.dtInicioDt.getTime();
  const tMax=D.dtConclusaoProj.getTime();
  function px(d){return ax+Math.max(0,Math.min(1,(d.getTime()-tMin)/(tMax-tMin)))*cW;}
  function py(hh){return ay+cH-(hh/D.totalHH)*cH;}

  // Grade horizontal
  const nGrid=5;
  for(let i=0;i<=nGrid;i++){
    const y=ay+(i/nGrid)*cH;
    const hh=D.totalHH*(1-i/nGrid);
    ctx.strokeStyle='#e0e0e0'; ctx.lineWidth=0.8; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(ax,y); ctx.lineTo(ax+cW,y); ctx.stroke();
    ctx.fillStyle='#333333'; ctx.font='bold 8.5px Arial'; ctx.textAlign='right';
    ctx.fillText(Math.round(hh)+'h',ax-5,y+3);
  }

  // Marcadores de semana — linhas verticais cinza mais visíveis
  const mseg=new Date(D.dtInicioDt);
  while(mseg.getDay()!==1) mseg.setDate(mseg.getDate()+1);
  ctx.strokeStyle='#cccccc'; ctx.lineWidth=0.8; ctx.setLineDash([2,2]);
  while(mseg.getTime()<=tMax){
    const x=px(mseg);
    if(x>=ax&&x<=ax+cW){
      ctx.beginPath(); ctx.moveTo(x,ay); ctx.lineTo(x,ay+cH); ctx.stroke();
    }
    mseg.setDate(mseg.getDate()+7);
  }
  ctx.setLineDash([]);

  // Labels eixo X (meses)
  ctx.fillStyle='#333333'; ctx.font='bold 9px Arial'; ctx.textAlign='center';
  const meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  let dm=new Date(D.dtInicioDt.getFullYear(),D.dtInicioDt.getMonth(),1);
  while(dm.getTime()<=tMax){
    const x=px(dm);
    if(x>ax+10&&x<=ax+cW-10){
      ctx.fillText(meses[dm.getMonth()]+'/'+String(dm.getFullYear()).slice(2),x,ay+cH+16);
      ctx.strokeStyle='#dddddd'; ctx.lineWidth=0.6; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(x,ay); ctx.lineTo(x,ay+cH); ctx.stroke();
    }
    dm=new Date(dm.getFullYear(),dm.getMonth()+1,1);
  }

  // ── Desenhar curvas — ordem: Ideal primeiro (embaixo), depois Real e Projeção (em cima) ──

  // 1. Curva ideal (azul vivo) — sem área preenchida
  ctx.beginPath(); ctx.strokeStyle='#1d4ed8'; ctx.lineWidth=3.5; ctx.setLineDash([]);
  D.ideal.forEach((pt,i)=>i===0?ctx.moveTo(px(pt.d),py(pt.hh)):ctx.lineTo(px(pt.d),py(pt.hh)));
  ctx.stroke();

  // 2. Projeção (verde claro tracejado) — área + linha
  ctx.beginPath();
  ctx.moveTo(px(D.proj[0].d),py(0));
  D.proj.forEach(pt=>ctx.lineTo(px(pt.d),py(pt.hh)));
  ctx.lineTo(px(D.proj[D.proj.length-1].d),py(0));
  ctx.closePath(); ctx.fillStyle='rgba(134,239,172,0.15)'; ctx.fill();

  ctx.beginPath(); ctx.strokeStyle='#22c55e'; ctx.lineWidth=3.5; ctx.setLineDash([8,4]);
  D.proj.forEach((pt,i)=>i===0?ctx.moveTo(px(pt.d),py(pt.hh)):ctx.lineTo(px(pt.d),py(pt.hh)));
  ctx.stroke(); ctx.setLineDash([]);

  // 3. Curva real (verde escuro sólida) — área + linha — SEMPRE POR CIMA
  ctx.beginPath();
  ctx.moveTo(px(D.real[0].d),py(0));
  D.real.forEach(pt=>ctx.lineTo(px(pt.d),py(pt.hh)));
  ctx.lineTo(px(D.real[D.real.length-1].d),py(0));
  ctx.closePath(); ctx.fillStyle='rgba(22,163,74,0.10)'; ctx.fill();

  ctx.beginPath(); ctx.strokeStyle='#16a34a'; ctx.lineWidth=4; ctx.setLineDash([]);
  D.real.forEach((pt,i)=>i===0?ctx.moveTo(px(pt.d),py(pt.hh)):ctx.lineTo(px(pt.d),py(pt.hh)));
  ctx.stroke();

  // Ponto final real
  const lr=D.real[D.real.length-1];
  ctx.beginPath(); ctx.arc(px(lr.d),py(lr.hh),6,0,Math.PI*2);
  ctx.fillStyle='#16a34a'; ctx.fill();
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=2; ctx.stroke();

  // ── Marcador de início — label tipo "HOJE" acima do ponto ──
  const xIni=px(D.dtInicioDt);
  const yIni=py(0);
  // Ponto de início
  ctx.beginPath(); ctx.arc(xIni,yIni,5,0,Math.PI*2);
  ctx.fillStyle='#16a34a'; ctx.fill();
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.5; ctx.stroke();
  // Label "INÍCIO" estilo HOJE
  const iniLbl=D.p.inicio;
  ctx.font='bold 7.5px Arial'; ctx.textAlign='center';
  const iniW=ctx.measureText(iniLbl).width+12;
  ctx.fillStyle='#374151';
  ctx.beginPath(); ctx.roundRect(xIni-iniW/2,yIni-32,iniW,16,3); ctx.fill();
  ctx.fillStyle='#ffffff';
  ctx.fillText(iniLbl,xIni,yIni-21);
  // Linha do label ao ponto
  ctx.strokeStyle='#374151'; ctx.lineWidth=1; ctx.setLineDash([2,2]);
  ctx.beginPath(); ctx.moveTo(xIni,yIni-16); ctx.lineTo(xIni,yIni-5); ctx.stroke();
  ctx.setLineDash([]);

  // ── Linha "HOJE" ──
  const xHoje=px(D.hoje);
  ctx.beginPath(); ctx.strokeStyle='#111111'; ctx.lineWidth=1.8; ctx.setLineDash([5,3]);
  ctx.moveTo(xHoje,ay); ctx.lineTo(xHoje,ay+cH); ctx.stroke(); ctx.setLineDash([]);
  // Label HOJE
  ctx.fillStyle='#111111';
  const hjW=38, hjH=16;
  ctx.beginPath(); ctx.roundRect(xHoje-hjW/2,ay-hjH-2,hjW,hjH,3); ctx.fill();
  ctx.fillStyle='#ffffff'; ctx.font='bold 8.5px Arial'; ctx.textAlign='center';
  ctx.fillText('HOJE',xHoje,ay-hjH/2+2);

  // ── Seta delta — só se |diasDelta| >= 1 ──
  if(Math.abs(D.diasDelta)>=1){
    let xIdealHoje=xHoje;
    for(let i=1;i<D.ideal.length;i++){
      if(D.ideal[i].hh>=D.hhExec){xIdealHoje=px(D.ideal[i].d);break;}
    }
    if(Math.abs(xHoje-xIdealHoje)>6){
      const yDelta=py(D.hhExec)-16;
      const cor=D.adiantado?'#15803d':'#b91c1c';
      ctx.strokeStyle=cor; ctx.lineWidth=2; ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(xIdealHoje,yDelta); ctx.lineTo(xHoje,yDelta); ctx.stroke();
      const dir=D.adiantado?1:-1;
      ctx.fillStyle=cor;
      ctx.beginPath();
      ctx.moveTo(xHoje+dir*7,yDelta);
      ctx.lineTo(xHoje,yDelta-5); ctx.lineTo(xHoje,yDelta+5);
      ctx.closePath(); ctx.fill();
    }
  }

  // ── Legenda ──
  const LX=ax, LY=GY+18;
  ctx.font='bold 9px Arial'; ctx.textAlign='left';
  ctx.strokeStyle='#1d4ed8'; ctx.lineWidth=3.5; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(LX,LY); ctx.lineTo(LX+24,LY); ctx.stroke();
  ctx.fillStyle='#111111'; ctx.fillText('Plano ideal',LX+28,LY+3);

  ctx.strokeStyle='#16a34a'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(LX+118,LY); ctx.lineTo(LX+142,LY); ctx.stroke();
  ctx.fillStyle='#111111'; ctx.fillText('Realizado',LX+146,LY+3);

  ctx.strokeStyle='#22c55e'; ctx.lineWidth=3.5; ctx.setLineDash([7,3]);
  ctx.beginPath(); ctx.moveTo(LX+232,LY); ctx.lineTo(LX+256,LY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle='#111111'; ctx.fillText('Projeção',LX+260,LY+3);

  // ── Cards ──
  const CX=10, cardY=HDR+10, cardW=CW_CARDS-14, cardH=62, cardGap=8;

  function card(x,y,w,h,bg,border){
    ctx.fillStyle=bg;
    ctx.beginPath(); ctx.roundRect(x,y,w,h,5); ctx.fill();
    if(border){ctx.strokeStyle=border;ctx.lineWidth=1.2;ctx.beginPath();ctx.roundRect(x,y,w,h,5);ctx.stroke();}
  }

  // Card 1: HH Executado
  card(CX,cardY,cardW,cardH,'#1a1a1a',null);
  ctx.fillStyle='rgba(255,255,255,0.65)';
  ctx.font='bold 9px Arial'; ctx.textAlign='left';
  ctx.fillText('HH EXECUTADO',CX+10,cardY+15);
  ctx.fillStyle='#F8C100';
  ctx.font='bold 20px Arial';
  ctx.fillText(Math.round(D.hhExec)+'/'+Math.round(D.totalHH)+' HH',CX+10,cardY+44);

  // Card 2: OS Executadas
  card(CX,cardY+cardH+cardGap,cardW,cardH,'#f5f5f5','#cccccc');
  ctx.fillStyle='#222222';
  ctx.font='bold 9px Arial'; ctx.textAlign='left';
  ctx.fillText('OS EXECUTADAS',CX+10,cardY+cardH+cardGap+15);
  ctx.fillStyle='#111111';
  ctx.font='bold 20px Arial';
  ctx.fillText(D.osExec+'/'+D.osTotal+' OS',CX+10,cardY+cardH+cardGap+44);

  // Card 3: Pontos
  card(CX,cardY+(cardH+cardGap)*2,cardW,cardH,'#f5f5f5','#cccccc');
  ctx.fillStyle='#222222';
  ctx.font='bold 9px Arial'; ctx.textAlign='left';
  ctx.fillText('PONTOS',CX+10,cardY+(cardH+cardGap)*2+15);
  ctx.fillStyle='#111111';
  ctx.font='bold 20px Arial';
  ctx.fillText(D.ptEnc+'/'+D.ptTotal+' PT',CX+10,cardY+(cardH+cardGap)*2+44);

  // Card 4: Situação
  const c3bg=D.adiantado?'#f0fdf4':'#fff1f2';
  const c3bd=D.adiantado?'#4ade80':'#f87171';
  const c3cor=D.adiantado?'#14532d':'#991b1b';
  card(CX,cardY+(cardH+cardGap)*3,cardW,cardH,c3bg,c3bd);
  ctx.fillStyle=c3cor;
  ctx.font='bold 9px Arial'; ctx.textAlign='left';
  ctx.fillText('EM RELAÇÃO AO PLANO',CX+10,cardY+(cardH+cardGap)*3+15);
  let sitLabel;
  if(D.diasDelta===0) sitLabel='Em dia';
  else if(D.adiantado) sitLabel='Adiantado +'+D.diasDelta+'D';
  else sitLabel='Atraso '+D.diasDelta+'D';
  ctx.fillStyle=c3cor;
  ctx.font='bold 18px Arial';
  ctx.fillText(sitLabel,CX+10,cardY+(cardH+cardGap)*3+44);

  // Card 5: Previsão
  card(CX,cardY+(cardH+cardGap)*4,cardW,cardH,'#f5f5f5','#cccccc');
  ctx.fillStyle='#222222';
  ctx.font='bold 9px Arial'; ctx.textAlign='left';
  ctx.fillText('PREVISÃO DE CONCLUSÃO',CX+8,cardY+(cardH+cardGap)*4+15);
  ctx.fillStyle='#111111';
  ctx.font='bold 17px Arial';
  ctx.fillText(D.dtFmt,CX+10,cardY+(cardH+cardGap)*4+38);
  ctx.fillStyle='#333333';
  ctx.font='bold 10px Arial';
  ctx.fillText('em '+D.diasParaConclusao+' dias',CX+10,cardY+(cardH+cardGap)*4+cardH-10);
}

window.baixarImagem=function(){
  const canvas=document.getElementById('slide');
  canvas.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='slide-projetos-seguranca.png';
    document.body.appendChild(a);a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  },'image/png');
};

main();
</script>
